# === Stage 1: Projects & H2 ===
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:taskmind-stage1;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=update
quarkus.flyway.baseline-on-migrate=true

# File System Root
taskmind.projects.root=${user.dir}/projects

# === AI / LangChain4j ===
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=llama3.1:8b

quarkus.langchain4j.embedding-model.provider=ollama
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text

# Logging
quarkus.log.category."com.taskmind".level=INFO
quarkus.log.category."org.jboss.resteasy.reactive".level=WARN
