# === Database ===
# Схему и сид создаёт DatabaseSchemaInitializer (infrastructure.db) один раз при
# старте, если таблиц ещё нет — не JDBC-урл: INIT=RUNSCRIPT перевыполнялся бы на
# каждом холодном старте, а не только при первом создании файла.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./anotes;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=none

# Test Database
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:anotes-test;DB_CLOSE_DELAY=-1

# File System Root
taskmind.projects.root=${user.dir}/projects

# === AI / LangChain4j ===
# Для включения Ollama раскомментируй зависимости в pom.xml и настройки ниже:
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.dev-ui.enabled=false
# quarkus.langchain4j.ollama.chat-model.model-id=llama3.1:8b
# quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text

# === Security (JWT) ===
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=taskmind
mp.jwt.verify.audiences=taskmind-api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Logging
quarkus.log.category."com.taskmind".level=INFO
quarkus.log.category."org.jboss.resteasy.reactive".level=WARN

# === OpenAPI ===
# Спека собирается из аннотаций ресурсов и доступна на /q/openapi (?format=yaml).
quarkus.smallrye-openapi.info-title=TaskMind API
quarkus.smallrye-openapi.info-version=5.0.0
quarkus.smallrye-openapi.info-description=REST API менеджера задач и базы знаний ANotes/TaskMind
# Все защищённые ручки помечены @RolesAllowed; auto-add-security проставляет им
# требование bearerAuth, иначе сгенерированный клиент не отправлял бы токен.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT из /api/auth/login или /api/auth/register
# Swagger UI по умолчанию живёт только в dev-режиме; в собранном jar тоже пригодится.
quarkus.swagger-ui.always-include=true
