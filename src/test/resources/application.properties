# Test configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:anotes-test;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema-h2-v4.sql'
quarkus.hibernate-orm.database.generation=none

taskmind.projects.root=D:/projects/java/ANotes/projects-test

quarkus.http.test-port=8081

# === Security (JWT) ===
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=taskmind
mp.jwt.verify.audiences=taskmind-api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

quarkus.log.category."com.taskmind".level=DEBUG
